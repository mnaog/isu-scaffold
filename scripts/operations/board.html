<style>

;border-radius:10px;overflow:hidden}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.mono{font-family:var(--mono);font-size:10px;color:var(--muted);overflow-wrap:anywhere}.badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:4px;background:#41464c;color:#b7bec5;font-size:10px;padding:4px 7px;line-height:1.2}.badge.running{background:#3c4b43;color:var(--green)}.badge.error{background:#503e3e;color:var(--red)}.note{font-size:11px;line-height:1.8;color:var(--muted);margin-top:10px;overflow-wrap:anywhere;white-space:pre-wrap}details{font-size:11px;color:var(--muted)}summary{cursor:pointer;line-height:1.7;list-style:none}summary::before{content:'＋';margin-right:5px;color:#a1a8af}details[open]>summary::before{content:'−'}summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}details[open]>summary{margin-bottom:9px}dl{display:grid;grid-template-columns:60px minmax(0,1fr);gap:6px;margin:0;line-height:1.7}dt{color:var(--muted)}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}.scouts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scout{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:17px;min-width:0;display:flex;flex-direction:column}.scout-head{display:flex;align-items:center;gap:9px;margin-bottom:15px}.avatar{flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;font:12px var(--mono);font-weight:600;background:#303337}.scout-name{font-size:11px;font-weight:600}.scout-model{font-size:9px;color:var(--muted);margin-top:3px}.scout-body{font-size:12px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;flex:1;min-height:67px}.scout-body.empty-text{color:#9ba2ab}.scout-foot{border-top:1px solid var(--line);padding-top:11px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font:9px var(--mono);color:var(--muted)}.scout-next{font-size:9px;color:var(-- [hidden]{display:none!important}.measurement-browser{display:grid;gap:10px;margin:20px 0 8px}.result-selector{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.result-selector>label{font-size:12px;font-weight:600}.result-selector>select{font-size:12px;max-width:100%;width:360px}.measurement-browser>p{font-size:11px;line-height:1.7;color:var(--muted)}.run-shortcuts{display:flex;gap:6px;flex-shrink:0}.run-shortcuts button{font-size:11px}button:disabled{opacity:.35;cursor:default}.measurement-options{position:relative;font-size:11px;justify-self:start}.measurement-options>summary{cursor:pointer;color:var(--muted);white-space:nowrap}.measurement-options[open]>summary{color:var(--accent)}.measurement-options .run-controls{position:absolute;left:0;top:24px;z-index:5;width:min(460px,80vw);margin:0;padding:18px;background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 28px #0005;border-radius:8px;display:grid;gap:14px}.measurement-options .run-controls label{display:flex;justify-content:space-between}.measurement-options select{min-width:0;width:65%}.measurement-options button{justify-self:end}.sort-heading{border:0;padding:0;background:none;color:inherit;font:inherit;white-space:nowrap}.sort-heading.active{color:var(--accent)}.run-info{padding:14px 18px}.run-info .detail-padding{padding:14px 0 0}.measurement-empty{padding:42px 24px;text-align:center;border:1px dashed var(--line);border-radius:10px}.measurement-empty h3{font-size:15px;margin-bottom:10px}.measurement-empty p{font-size:12px;color:var(--muted);line-height:1.8}.measurement-empty details{text-align:left;max-width:700px;margin:20px auto 0}@media(max-width:760px){.result-selector{gap:10px}.result-selector>label{width:100%}.result-selector>select{width:100%}.measurement-options .run-controls{width:min(460px,calc(100vw - 36px))}}

.scenario-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;font-size:11px}.scenario-toolbar label{display:flex;align-items:center;gap:5px}.scenario-canvas{overflow:auto;min-height:180px;padding:18px;background:#292b2e}.scenario-canvas svg{max-width:none!important}.scenario-canvas .node{cursor:pointer}.scenario-canvas .node:focus{outline:2px solid var(--accent)}.scenario-source{max-height:300px;overflow:auto;white-space:pre-wrap;font:11px/1.7 var(--mono);padding:15px}.scenario-legend{display:flex;gap:15px;flex-wrap:wrap;padding:10px 18px;font-size:11px}.scenario-legend span{border-left:5px solid var(--line);padding-left:7px}.scenario-summary{padding:14px 18px;font-size:12px;line-height:1.8}.scenario-status{font-size:12px;color:var(--muted);padding:15px}.scenario-route{padding:12px 18px}.scenario-route button{margin:6px}

.table-tools button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}input{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:8px}.chart-probe{font:11px/1.8 var(--mono);min-height:36px;margin-top:8px;color:var(--accent)}
.scenario-example{display:flex;align-items:center;gap:16px;padding:24px 18px;overflow-x:auto}.scenario-example-node{display:flex;flex-direction:column;gap:12px;flex:1;min-width:150px;border:1px dashed #929ba6;border-radius:8px;background:#363b42;padding:20px;color:#c2c9d1}.scenario-example-node span{font-size:11px}.scenario-example-arrow{color:#929ba6;font-size:24px}
.scenario-example-banner{padding:24px 24px 0}.scenario-example-banner strong{display:block;font-size:24px;letter-spacing:.03em;color:var(--ink)}.scenario-example-banner p{margin-top:8px;font-size:13px;color:var(--muted)}.scenario-preview-graph{width:100%;min-width:650px;height:auto;display:block}.scenario-preview-wrap{overflow-x:auto;padding:12px 24px 24px}.scenario-preview-graph text{font-family:var(--mono);fill:#d6dee3}.scenario-preview-graph .sample-sub{fill:#929ea9;font-size:12px}.scenario-toolbar{justify-content:flex-end}.scenario-settings{padding:10px 18px;font-size:11px;color:var(--muted)}.route{max-width:440px}.route>.detail-link{font-size:12px;line-height:1.65}.table-tools{justify-content:flex-end}.table-tools input{max-width:260px}.metric-volume{height:3px;background:#718f88;margin-top:7px;border-radius:2px;max-width:120px}
.flow-route{font:600 12px var(--mono);fill:#e0e6eb}.flow-small{font:10px var(--mono);fill:#a6b1ba}.flow-value{font:11px var(--mono);fill:#d5dedf}.flow-api{cursor:pointer}.flow-api:hover rect:first-child,.flow-api:focus rect:first-child{stroke:#b6cec5}.metric-ranking td{font-variant-numeric:tabular-nums;color:#bbc3cb}.metric-ranking td.metric-primary{font-weight:700;font-size:14px;color:#edf1ee}.metric-ranking td.delta-up{color:#e4b491}.metric-ranking td.delta-down{color:#97bdcf}.metric-ranking tbody tr:hover{background:#ffffff04}.metric-ranking .route{min-width:220px}.metric-ranking .node-label{font-size:10px;color:var(--muted);margin-top:5px}.chart-missing{align-self:start;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px}.chart-missing h3{margin:0;font-weight:400;color:var(--muted)}.chart-missing .panel-note{padding:0}.scenario-canvas{background:#2b3035}.scenario-summary{padding:8px 18px;font-size:11px;color:var(--muted)}
.chart-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}.chart-heading h3{margin:0}.chart-heading .chart-legend{justify-content:flex-end;flex-shrink:0;max-width:50%}.chart-missing .chart-heading{margin:0}

.result-pass{background:#33493d;color:var(--green)}.result-fail{background:#503e3e;color:var(--red)}.stat-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.history-table th,.history-table td{text-align:left;vertical-align:top}.history-table th:nth-child(5),.history-table td:nth-child(5){text-align:right}.history-table .history-hypothesis{max-width:480px;line-height:1.8}.score-detail{display:grid;gap:12px;padding-top:16px;font-size:12px;line-height:1.7;font-family:inherit}.score-detail-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.score-detail-label{font-size:11px;color:var(--muted)}.score-detail-date{color:var(--muted)}.score-detail-hypothesis{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;align-items:baseline}.score-detail-hypothesis p{color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}.score-detail details{font-size:10px}.score-detail details p{margin-top:8px}.score-point .score-selection{stroke:var(--ink);stroke-width:1.5}

<body>
<header><div class="brand"><div class="mark">i.</div>ISU SCAFFOLD <span>/ Operations</span></div><div class="top-status"><span id="daemon">scout 停止</span><span id="updated">接続中</span></div></header>
<main>

<div id="connection-error" role="status"></div>
<div class="overview" id="overview"></div>
<section class="score-section"><div class="panel score-panel" id="score-history"></div></section>
<div id="operation-status" class="operation-status" aria-live="polite"></div>
<div class="workspace">
<section><div class="section-title"><div><h2>Scout</h2><span class="count">04</span></div><span class="section-note">各scoutの最新報告</span></div><div id="scouts" class="scouts"></div></section>
</div>
<section class="metrics-section"><div class="section-title"><div><h2>計測結果</h2><span class="count">ISUSCOPE</span></div><span class="section-note" id="metric-time">計測結果を待っています</span></div>
<div class="measurement-browser">
<div class="result-selector"><label for="run-select">表示する計測結果</label><select id="run-select" aria-describedby="measurement-context"><option value="">最新の結果（自動更新）</option></select><div class="run-shortcuts"><button type="button" id="previous-run" aria-label="前の計測結果">← 前の結果</button><button type="button" id="next-run" aria-label="次の計測結果">次の結果 →</button><button type="button" id="latest-run">最新に戻る</button></div></div>
<p id="measurement-context">選んだ1回のベンチの結果を、下のグラフ・表に表示します。</p>
<details class="measurement-options"><summary>比較・表示設定</summary><div class="run-controls">
<label>比較元 <select id="base-select"><option value="auto">分析の比較元に追従</option><option value="">比較なし</option></select></label>
<label>サーバー <select id="node-select"><option value="">全サーバー</option></select></label>
<label>HTTP・SQLの件数 <select id="row-limit"><option>25</option><option selected>50</option><option>100</option></select></label>
<button type="button" id="reload-detail">再取得</button>
</div></details></div><p id="workspace-context" class="panel-note"></p><div id="metrics"></div></section>
<footer><span>ISU SCAFFOLD / OPERATIONS BOARD</span><span>状態 5秒更新 · 計測 30秒更新</span></footer>
</main>
<dialog id="metric-dialog" aria-label="計測詳細"><button type="button" id="close-detail">閉じる</button><div id="metric-dialog-body"></div></dialog>
<script>
const labels={running:'探索中',waiting:'待機',stopped:'停止',error:'エラー'};
const names={claude:['Claude Code','Anthropic','C'],codex:['Codex','OpenAI','O'],kimi:['Kimi Code','Kimi K3','K'],opencode:['OpenCode','DeepSeek · Zen','D']};
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};
const num=(n,d=0)=>n==null?'—':Number(n).toLocaleString('ja-JP',{maximumFractionDigits:d});
const short=s=>s?s.slice(0,8):'—';
const time=t=>t?new Date(t*1000).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'未投稿';
const date=t=>t?new Date(t*1000).toLocaleString('ja-JP'):'—';
function badge(state){return el('span',labels[state]||state,'badge '+state)}
function empty(parent,title,desc){const box=el('div',null,'empty');box.append(el('div','·','empty-symbol'),el('p',title,'empty-title'),el('p',desc,'empty-desc'));parent.append(box)}
function disclosure(parent,title,key){const d=el('details');if(key)d.dataset.key=key;d.append(el('summary',title));parent.append(d);return d}
function dataList(parent,pairs){const dl=el('dl');for(const [key,value]of pairs)dl.append(el('dt',key),el('dd',value||'—'));parent.append(dl)}
function stat(label,value,sub,cls=''){const s=el('div',null,'stat');s.append(el('p',label,'stat-label'),el('div',value,'stat-value '+cls),el('p',sub,'stat-sub'));return s}
function resultBadge(run){
 const failed=run.passed===false||['failed','aborted'].includes(run.state);
 return el('span',run.state==='aborted'?'中断':failed?'FAIL':run.passed===true?'PASS':'判定なし','badge '+(failed?'result-fail':run.passed===true?'result-pass':''));
}
function overviewSelection(d){
 if(detailState)return detailState;
 const metrics=d?.metrics||{},id=document.querySelector('#run-select').value;
 return {latest:id?(metrics.score_history||[]).find(r=>r.id===id):metrics.latest,loading:true};
}
function renderOverview(d){
 const q=d.metrics||{},run=q.latest,score=run?.score;
 const selected=!!document.querySelector('#run-select').value;
 const card=stat(selected?'選択したベンチスコア':'最新のベンチスコア',num(score),'',score!=null?'accent':'');
 const sub=card.children[2];
 if(run){sub.append(resultBadge(run));}
 else sub.textContent='最初の計測結果を待っています';
 const issues=q.brief?.coverage_issues?.total_count;
 document.querySelector('#overview').replaceChildren(card,stat('計測の取得状況',issues==null?'—':num(issues)+'件',q.loading&&run?'選択した結果を取得中':issues==null?'取得状況は未確認':'報告された不足・失敗。ページ下部に詳細'));
}
const svgEl=(tag,attrs={},text)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,String(v));if(text!=null)e.textContent=text;return e};
function renderScoreHistory(q){
 const root=document.querySelector('#score-history');root.replaceChildren();
 const head=el('div',null,'score-heading'),title=el('div'),legend=el('div',null,'score-legend');title.append(el('h3','スコアの推移'));legend.append(el('span','● PASS','pass'),el('span','× FAIL / 中断','fail'),el('span','○ 判定なし'));head.append(title,legend);root.append(head);
 const runs=(q.score_history||[]).map(r=>({...r,t:Date.parse(r.started_at)})).filter(r=>Number.isFinite(r.t)).sort((a,b)=>a.t-b.t).map((r,index)=>({...r,index}));
 if(!runs.length){root.append(el('p','完了したrunが記録されると、ここにスコアの推移が表示されます。','score-empty'));return}
 const note=el('p',`直近100件から終了したベンチ ${runs.length}回 · 横軸は表示範囲内の実行順（FAIL・中断を含む）`,'section-note');note.style.marginBottom='10px';root.append(note);
 const width=Math.max(1100,runs.length*28+100);
 const scroll=el('div',null,'score-scroll'),svg=svgEl('svg',{viewBox:`0 0 ${width} 215`,class:'score-svg',role:'group','aria-label':'ベンチ実行順に等間隔で並べたスコアの推移。各点から日時と詳細を確認できます。'});svg.style.minWidth=width+'px';scroll.append(svg);root.append(scroll);
 const detail=el('div',null,'score-detail');root.append(detail);
 const hasScore=r=>typeof r.score==='number'&&Number.isFinite(r.score);
 const failed=r=>r.passed===false||['failed','aborted'].includes(r.state);
 const left=65,right=width-20,top=12,bottom=158,missingY=182;
 const scores=runs.filter(hasScore).map(r=>r.score),max=Math.max(1,...scores)*1.12,min=Math.min(0,...scores);
 const x=r=>runs.length===1?(left+right)/2:left+r.index/(runs.length-1)*(right-left),y=r=>hasScore(r)?bottom-(r.score-min)/(max-min)*(bottom-top):missingY;
 for(let i=0;i<=4;i++){const yy=bottom-i*(bottom-top)/4;svg.append(svgEl('line',{x1:left,x2:right,y1:yy,y2:yy,class:'score-grid'}),svgEl('text',{x:left-12,y:yy+3,'text-anchor':'end',class:'score-axis'},num(min+i*(max-min)/4)));}
 const multiDay=new Date(runs[0].t).toDateString()!==new Date(runs[runs.length-1].t).toDateString();
 const timeStep=Math.max(1,Math.ceil((runs.length-1)/6));
 for(const r of runs){
  const last=r.index===runs.length-1;
  if(last||r.index%timeStep===0&&(runs.length-1-r.index>=timeStep/2)){
   const label=new Date(r.t).toLocaleString('ja-JP',{...(multiDay?{month:'numeric',day:'numeric'}:{}),hour:'2-digit',minute:'2-digit'});
   svg.append(svgEl('text',{x:x(r),y:208,'text-anchor':runs.length===1?'middle':r.index===0?'start':last?'end':'middle',class:'score-axis'},label));
  }
 }
 if(runs.some(r=>!hasScore(r)))svg.append(svgEl('text',{x:left-12,y:missingY+3,'text-anchor':'end',class:'score-axis'},'未取得'));
 let path='';let connected=false;for(const r of runs){if(r.passed===true&&!failed(r)&&hasScore(r)){path+=(connected?' L ':' M ')+x(r)+' '+y(r);connected=true;}else connected=false;}if(path)svg.append(svgEl('path',{d:path,class:'score-line'}));
 const selectedId=document.querySelector('#run-select').value||q.latest?.id||runs[runs.length-1].id;
 function show(r){
  const top=el('div',null,'score-detail-top');
  top.append(el('span',document.querySelector('#run-select').value?'選択中の結果':'最新の結果','score-detail-label'),resultBadge(r),el('span',new Date(r.t).toLocaleString('ja-JP'),'score-detail-date'));
  const hypothesis=el('div',null,'score-detail-hypothesis');hypothesis.append(el('span','試したこと','score-detail-label'),el('p',r.hypothesis||'記録なし'));
  const source=el('details');source.setAttribute('data-key','score-source');source.append(el('summary','run・コードの情報'),el('p','run '+(r.short_id||r.id.slice(-8))+' / commit '+short(r.commit_hash)+(r.dirty?' (dirty)':''),'mono'));
  detail.replaceChildren(top,hypothesis,source);
 }

 for(const r of runs){const cx=x(r),cy=y(r),color=failed(r)?'var(--red)':r.passed===true?'var(--accent)':'var(--muted)';const point=svgEl('g',{class:'score-point',tabindex:0,role:'img','aria-label':`${r.index+1}回目 / ${new Date(r.t).toLocaleString('ja-JP')} / ${failed(r)?'FAIL・中断':r.passed===true?'PASS':'判定なし'} / スコア ${hasScore(r)?r.score:'未取得'} / run ${r.short_id||r.id}`});point.append(svgEl('circle',{cx,cy,r:9,fill:'transparent',stroke:'none'}));if(failed(r)){point.append(svgEl('path',{d:`M ${cx-4} ${cy-4} L ${cx+4} ${cy+4} M ${cx+4} ${cy-4} L ${cx-4} ${cy+4}`,stroke:color,'stroke-width':2}));}else point.append(svgEl('circle',{cx,cy,r:4.5,fill:r.passed===true?color:'var(--paper)',style:`stroke:${color}`}));point.append(svgEl('title',{},`${r.index+1}回目 · ${new Date(r.t).toLocaleString('ja-JP')} · ${hasScore(r)?num(r.score):'スコア未取得'}`));if(r.id===selectedId)point.append(svgEl('circle',{cx,cy,r:7.5,fill:'none',stroke:'var(--ink)','stroke-width':1.5,class:'score-selection'}));point.setAttribute('aria-pressed',r.id===selectedId?'true':'false');point.setAttribute('role','button');point.addEventListener('click',()=>chooseRun(r.id));point.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseRun(r.id)}});svg.append(point);}
 show(runs.find(r=>r.id===selectedId)||runs[runs.length-1]);
}
function renderScouts(scouts){const root=document.querySelector('#scouts');root.replaceChildren();for(const name of ['claude','codex','kimi','opencode']){const s=scouts.find(x=>x.name===name)||{name,state:'stopped'},n=names[name];const card=el('article',null,'scout'),head=el('div',null,'scout-head'),identity=el('div');identity.append(el('p',n[0],'scout-name'),el('p',n[1],'scout-model'));head.append(el('div',n[2],'avatar'),identity);card.append(head,el('p',s.report??'まだ報告はありません。','scout-body'+(s.report==null?' empty-text':'')));const foot=el('div',null,'scout-foot');const posted=el('time',time(s.posted_at));posted.title=date(s.posted_at);if(s.state!=='stopped')foot.append(badge(s.state));foot.append(posted);card.append(foot);if(s.next_at&&s.state!=='stopped')card.append(el('p',`次回 ${date(s.next_at)}`,'scout-next'));if(s.error){const detail=disclosure(card,'接続・実行の確認が必要','scout-'+name);detail.append(el('p',s.error,'error-text'));}root.append(card)}}
function table(parent,heads,rows){const scroll=el('div',null,'table-scroll'),t=el('table'),thead=el('thead'),tr=el('tr');heads.forEach(h=>tr.append(el('th',h)));thead.append(tr);t.append(thead);const body=el('tbody');rows.forEach(row=>{const tr=el('tr');row.forEach(value=>{const td=el('td');value instanceof Node?td.append(value):td.textContent=value??'—';tr.append(td)});body.append(tr)});t.append(body);scroll.append(t);parent.append(scroll)}
function metricPanel(title,context){const panel=el('div',null,'panel'),head=el('div',null,'metric-heading');head.append(el('h3',title),el('span',context,'mono'));panel.append(head);return panel}
function render(d){const opened=new Set([...document.querySelectorAll('details[open][data-key]')].map(x=>x.dataset.key));renderOverview({...d,metrics:overviewSelection(d)});renderScoreHistory(d.metrics||{});renderScouts(d.scouts||[]);renderOperationStatus(d);updateRunChoices(d);for(const detail of document.querySelectorAll('details[data-key]'))detail.open=opened.has(detail.dataset.key);const daemon=document.querySelector('#daemon');daemon.hidden=!d.daemon_running;daemon.replaceChildren(el('span','', 'dot'),document.createTextNode('scout 稼働中'));daemon.style.color=d.daemon_running?'var(--green)':'var(--muted)';document.querySelector('#updated').textContent='更新 '+time(Date.now()/1000);}
let refreshing=false;
async function refresh(){if(refreshing)return;refreshing=true;try{const response=await fetch('/api/board');if(!response.ok)throw Error(response.status);render(await response.json());document.querySelector('#connection-error').textContent='';}catch(e){document.querySelector('#connection-error').textContent='更新できません。表示中の情報は前回取得時点のものです。 '+e.message;}finally{refreshing=false}}

</script>
<script src="/mermaid.tiny.js"></script>
<script src="/board-scenario.js"></script>
<script src="/board-insights.js"></script>
<script src="/board-workspace.js"></script>
<script src="/board-details.js"></script>
</body></html>
