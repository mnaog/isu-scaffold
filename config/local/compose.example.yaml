# Copy to compose.yaml after code import, then adapt services, SQL and app settings.
# Lane local-env replaces the next lines with: how to start and check (make local-up / local-check,
# the GET that stands in for health), and what does not run here (missing services, initial data:
# schema only / reduced / full). Whoever verifies locally reads this before trusting a result.
# Never use container_name, external volumes/networks, or host networking here.
services:
  db:
    image: ${LOCAL_DB_IMAGE:?after the start - set the database image after inspecting the app}
    environment:
      MYSQL_ROOT_PASSWORD: local-only-root
      MYSQL_DATABASE: isucon
      MYSQL_USER: isucon
      MYSQL_PASSWORD: isucon
    volumes:
      - db:/var/lib/mysql
      - ${LOCAL_INIT_DIR}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=isucon mysql -h 127.0.0.1 -uisucon isucon -e "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 90
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_IMAGE: ${LOCAL_GO_IMAGE:?after the start - set the golang image matching go.mod after inspecting the app}
    init: true
    working_dir: /webapp/go
    command: [sh, /local-start.sh]
    environment:
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/gomod
      GOFLAGS: -buildvcs=false
      # LOCAL_RACE=1 make local-upでrace detector付きにbuildする（start.sh、make local-race）。
      LOCAL_RACE: ${LOCAL_RACE:-}
      ISUCON_DB_HOST: db
      ISUCON_DB_PORT: '3306'
      ISUCON_DB_USER: isucon
      ISUCON_DB_PASSWORD: isucon
      ISUCON_DB_NAME: isucon
    volumes:
      - ../../webapp:/webapp:ro
      - gocache:/cache
    ports:
      - '127.0.0.1::8080'
    depends_on:
      db:
        condition: service_healthy
volumes:
  db:
  gocache:
