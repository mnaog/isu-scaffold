# B1: appへの接続を使い回す。問題ごとのsite設定（sites-available/*.conf）へ差し込む例。
upstream app {
    server 127.0.0.1:8080;
    keepalive 128;
}

server {
    # ...既存のlisten/rootはそのまま...
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
