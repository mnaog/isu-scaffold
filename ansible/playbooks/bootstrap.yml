---
- name: Prepare all ISUCON nodes
  hosts: application:benchmark
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../config/ansible-vars.json"

  roles:
    - role: bootstrap

- name: Prepare observability on application nodes
  hosts: application
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../config/ansible-vars.json"

  roles:
    - role: observability
