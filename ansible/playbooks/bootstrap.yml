---
- name: Prepare all ISUCON nodes
  hosts: application:benchmark
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../config/ansible-vars.json"

  pre_tasks:
    - name: Wait for initial provisioning before changing packages or services
      ansible.builtin.command:
        argv: [timeout, "{{ bootstrap_provision_timeout_seconds | default(1800) | int }}", bash, -s]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/wait-provision.sh') }}"
      changed_when: false

  roles:
    - role: bootstrap

- name: Prepare observability on application nodes
  hosts: application
  become: true
  # Facts for these hosts were gathered by the preceding play in this run.
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../config/ansible-vars.json"

  roles:
    - role: observability
