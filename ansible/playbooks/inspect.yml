---
- name: Inspect initial node composition without changing it
  hosts: application:benchmark
  become: false
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: Read service facts
      ansible.builtin.service_facts:

    - name: Read listening sockets
      ansible.builtin.shell: |
        set -o pipefail
        if command -v ss >/dev/null 2>&1; then
          ss -lntup
        elif command -v netstat >/dev/null 2>&1; then
          netstat -lntup
        else
          exit 75
        fi
      args:
        executable: /bin/bash
      register: inspection_sockets
      changed_when: false
      failed_when: inspection_sockets.rc not in [0, 75]

    - name: Read process names without arguments
      ansible.builtin.command:
        argv: [ps, -eo, "pid,user,comm"]
      register: inspection_processes
      changed_when: false

    # One search gives both the candidates and their owners; the report keeps both fields.
    - name: Find likely application roots with their owners
      ansible.builtin.shell: |
        find /home /opt /srv -maxdepth 4 -type f \
          \( -name go.mod -o -name Cargo.toml -o -name package.json -o -name Gemfile \
             -o -name requirements.txt -o -name pom.xml -o -name build.gradle \) \
          -print0 2>/dev/null | while IFS= read -r -d '' path; do
            stat --printf='%n\t%U\t%G\n' "$path"
          done | sort | head -n 200 |
          python3 -c 'import json, sys; lines = [line.rstrip("\n") for line in sys.stdin]; print(json.dumps({"candidates": [line.split("\t")[0] for line in lines], "ownership": lines}))'
      args:
        executable: /bin/bash
      register: inspection_app_candidates
      changed_when: false

    - name: Find known configuration paths
      ansible.builtin.shell: |
        for path in /etc/nginx/nginx.conf /etc/mysql /etc/mysql/conf.d /etc/mysql/mysql.conf.d /etc/mysql/mysql.cnf /etc/mysql/mariadb.conf.d /etc/mysql/mariadb.cnf /etc/mysql/my.cnf /etc/my.cnf /etc/redis /etc/postgresql; do
          if test -e "$path"; then printf '%s\n' "$path"; fi
        done
      args:
        executable: /bin/bash
      register: inspection_configuration_paths
      changed_when: false

    - name: Find systemd service fragment paths
      ansible.builtin.shell: |
        units=$({
          systemctl list-unit-files --type=service --no-legend --no-pager 2>/dev/null
          systemctl list-units --type=service --all --no-legend --no-pager 2>/dev/null
        } | awk '$1 ~ /\.service$/ && $1 !~ /@\.service$/ {print $1}' | sort -u)
        test -n "$units" || exit 0
        # One systemctl call for every unit: it prints one block per argument, in argument order.
        # Templates (foo@.service) have no FragmentPath and would make the whole call fail.
        # Each value keeps a leading "=" so that empty paths still count as lines.
        fragments=$(systemctl show --property=FragmentPath -- $units 2>/dev/null | sed -n 's/^FragmentPath=/=/p')
        if test "$(printf '%s\n' "$fragments" | grep -c '^=')" -ne "$(printf '%s\n' "$units" | grep -c .)"; then
          fragments=$(printf '%s\n' "$units" | while IFS= read -r unit; do
            printf '=%s\n' "$(systemctl show "$unit" -p FragmentPath --value 2>/dev/null || true)"
          done)
        fi
        paste <(printf '%s\n' "$units") <(printf '%s\n' "$fragments") |
          awk -F '\t' '$2 != "=" {print $1 "\t" substr($2, 2)}'
      args:
        executable: /bin/bash
      register: inspection_service_fragments
      changed_when: false

    # sites-enabled is usually a symlink into sites-available; the real file is what deploy replaces.
    - name: Find enabled Nginx site files
      ansible.builtin.shell: |
        for dir in /etc/nginx/sites-enabled /etc/nginx/conf.d; do
          test -d "$dir" || continue
          for entry in "$dir"/*; do
            test -f "$entry" || continue
            printf '%s\t%s\n' "$entry" "$(readlink -f "$entry")"
          done
        done
      args:
        executable: /bin/bash
      register: inspection_nginx_site_files
      changed_when: false

    # Units defined for this machine often read an environment file (DB host, ports) outside the app tree.
    - name: Find environment files of locally defined services
      # Reuses the fragment paths above instead of asking systemctl for every unit again.
      ansible.builtin.shell: |
        while IFS=$'\t' read -r unit fragment; do
          case "$fragment" in /etc/systemd/system/*) ;; *) continue ;; esac
          systemctl cat "$unit" 2>/dev/null | sed -n 's/^[[:space:]]*EnvironmentFile=-\{0,1\}//p' |
            while IFS= read -r file; do
              case "$file" in /*) ;; *) continue ;; esac
              owner=$(sudo -n stat --printf='%U\t%G' "$file" 2>/dev/null || printf 'missing\tmissing')
              printf '%s\t%s\t%s\n' "$unit" "$file" "$owner"
            done
        done
      args:
        executable: /bin/bash
        stdin: "{{ inspection_service_fragments.stdout }}"
      register: inspection_service_environment_files
      changed_when: false

    - name: Find Nginx access log paths
      ansible.builtin.shell: |
        command -v nginx >/dev/null 2>&1 || exit 0
        sudo -n nginx -T 2>&1 |
          awk '$1 == "access_log" { path=$2; sub(/;$/, "", path); if (path ~ /^\//) print path }' |
          sort -u
      args:
        executable: /bin/bash
      register: inspection_nginx_access_logs
      changed_when: false

    - name: Find MySQL slow log paths
      ansible.builtin.shell: |
        for root in /etc/mysql /etc/my.cnf; do
          test -e "$root" || continue
          sudo -n grep -RhsE '^[[:space:]]*slow[_-]query[_-]log[_-]file[[:space:]]*=' "$root" 2>/dev/null || true
        done | sed -E 's/^[^=]*=[[:space:]]*//' | sed -E 's/[[:space:]]*[#;].*$//' |
          awk '/^\// {print}' | sort -u
      args:
        executable: /bin/bash
      register: inspection_mysql_slow_logs
      changed_when: false

    # One remote shell instead of a loop: each loop item is a separate module run.
    - name: Probe common commands
      ansible.builtin.shell: |
        for tool in nginx mysql psql redis-server go rustc node ruby python3 java perf sar slp \
            stackcollapse-perf.pl flamegraph.pl offcputime-bpfcc; do
          version=
          if command -v "$tool" >/dev/null 2>&1; then
            version=$(case "$tool" in
              nginx) nginx -v ;;
              go) go version ;;
              *) "$tool" --version ;;
            esac </dev/null 2>&1 | head -n 1)
          fi
          printf '%s\t%s\n' "$tool" "${version//$'\t'/ }"
        done | python3 -c 'import json, sys; print(json.dumps(dict(line.rstrip("\n").split("\t", 1) for line in sys.stdin)))'
      args:
        executable: /bin/bash
      register: inspection_versions
      changed_when: false

    - name: Save inspection report on controller
      ansible.builtin.copy:
        content: >-
          {{ {
            'node': inventory_hostname,
            'distribution': ansible_facts.distribution,
            'distribution_version': ansible_facts.distribution_version,
            'kernel': ansible_facts.kernel,
            'architecture': ansible_facts.architecture,
            'processor_vcpus': ansible_facts.processor_vcpus,
            'memory_mb': ansible_facts.memtotal_mb,
            'running_services': (ansible_facts.services | dict2items | selectattr('value.state', 'equalto', 'running') | map(attribute='key') | sort | list),
            'listening_sockets': inspection_sockets.stdout_lines,
            'processes': inspection_processes.stdout_lines,
            'application_candidates': (inspection_app_candidates.stdout | from_json).candidates,
            'application_candidate_ownership': (inspection_app_candidates.stdout | from_json).ownership,
            'configuration_paths': inspection_configuration_paths.stdout_lines,
            'service_fragments': inspection_service_fragments.stdout_lines,
            'nginx_access_logs': inspection_nginx_access_logs.stdout_lines,
            'nginx_site_files': inspection_nginx_site_files.stdout_lines,
            'service_environment_files': inspection_service_environment_files.stdout_lines,
            'mysql_slow_logs': inspection_mysql_slow_logs.stdout_lines,
            'versions': (inspection_versions.stdout | from_json)
          } | to_nice_json }}
        dest: "{{ inspection_output_dir }}/{{ inventory_hostname }}.json"
        mode: '0600'
      delegate_to: localhost
