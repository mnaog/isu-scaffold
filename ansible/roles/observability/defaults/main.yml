---
observability_tools_strict: false
observability_install_packages: true
observability_packages: [sysstat, git, ethtool, zstd]
observability_install_offcpu: false
observability_offcpu_packages: [bpfcc-tools]
observability_download_tools: true
observability_tools_source: bundled
observability_release_tools:
  - {name: slp, version: v0.2.1}
observability_go_arch: {x86_64: amd64, aarch64: arm64}
observability_flamegraph_directory: /opt/FlameGraph
observability_isuscope_node_directory: "{{ playbook_dir }}/../../.local/isuscope-node"
observability_flamegraph_version: 41fee1f99f9276008b7cd112fca19dc3ea84ac32
observability_probe_commands: []
observability_required_commands: []
observability_local_tools: []
observability_time_sync: true
observability_persistent_journal: true
observability_journal_max_use: 512M
observability_stop_auto_updates: true
observability_nginx_ltsv: true
observability_nginx_ltsv_path: /var/log/nginx/isuscope-access.log
observability_nginx_session_source: '$cookie_session'
observability_mysql_slow_log: false
observability_mysql_slow_log_path: /var/log/mysql/isuscope-slow.log
observability_log_max_size: 512M
isuscope_fingerprint_paths: []
isuscope_tree_digest_source: "{{ playbook_dir }}/../../scripts/tree-digest.py"
isuscope_tree_digest_path: /usr/local/lib/isuscope/tree-digest.py
