---
# Measurement and operating baseline fixed in the first hour. Nothing here tunes performance;
# performance changes (config/nginx/tare, sysctl networking, MySQL buffers) come after baseline.
- name: Install measurement packages and tools
  ansible.builtin.import_tasks: tools.yml
  tags: [observability_tools]

- name: Keep clocks, journals and background jobs stable
  ansible.builtin.import_tasks: system.yml
  tags: [observability_system]

- name: Add the isuscope LTSV access log to Nginx
  ansible.builtin.import_tasks: nginx_log.yml
  tags: [observability_nginx_log]

- name: Enable the isuscope MySQL slow log
  ansible.builtin.import_tasks: mysql_slow_log.yml
  tags: [observability_mysql_slow_log]

- name: Rotate measurement logs by size
  ansible.builtin.import_tasks: logrotate.yml
  tags: [observability_logrotate]

- name: Prepare the persistent Rust build cache
  ansible.builtin.import_tasks: rust_cache.yml
  tags: [observability_rust_cache]

- name: Install the isuscope node helpers
  ansible.builtin.import_tasks: helpers.yml
  tags: [observability_helpers]
